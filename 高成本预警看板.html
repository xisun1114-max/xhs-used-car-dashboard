<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>转转二手车-高成本预警看板</title>
  <script src="./xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f6f1ea;
      --panel: rgba(255,255,255,.94);
      --ink: #241b15;
      --muted: #77695d;
      --line: #e7dbce;
      --accent: #bb4d2f;
      --accent-soft: #f8e6df;
      --green: #166534;
      --orange: #b45309;
      --shadow: 0 18px 45px rgba(54, 33, 20, .10);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(187, 77, 47, .15), transparent 24%),
        radial-gradient(circle at top right, rgba(248, 210, 166, .30), transparent 22%),
        linear-gradient(180deg, #fffdfa 0, var(--bg) 280px);
    }
    .shell {
      max-width: 1560px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .hero {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .hero-card, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero-card {
      flex: 1;
      padding: 22px 24px;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: .01em;
    }
    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .note {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(187, 77, 47, .08), rgba(248, 230, 223, .65));
      color: #5c4639;
      font-size: 13px;
    }
    .hero-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 0 0 auto;
    }
    .action-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 14px;
      height: 46px;
      min-width: 120px;
      padding: 0 14px;
      font: inherit;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric {
      padding: 16px 18px;
    }
    .metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .metric .value {
      font-size: 28px;
      line-height: 1.1;
      font-weight: 800;
    }
    .stack {
      display: grid;
      gap: 16px;
    }
    .history-panel {
      padding: 18px;
    }
    .fixed-card {
      height: 420px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .scroll-body {
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }
    .panel-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 14px;
    }
    .panel-title h2 {
      margin: 0;
      font-size: 18px;
    }
    .panel-title span {
      color: var(--muted);
      font-size: 12px;
    }
    .history-chart {
      display: grid;
      gap: 10px;
    }
    .history-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 112px;
      gap: 10px;
      align-items: center;
    }
    .history-date {
      font-size: 12px;
      color: var(--muted);
    }
    .history-bar-track {
      height: 12px;
      border-radius: 999px;
      background: #f2e6d9;
      overflow: hidden;
      position: relative;
    }
    .history-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d66d4f, #bb4d2f);
    }
    .history-meta {
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .history-list {
      display: grid;
      gap: 10px;
    }
    .frequency-chart {
      display: grid;
      gap: 12px;
    }
    .frequency-item {
      display: grid;
      gap: 6px;
    }
    .frequency-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .frequency-name {
      min-width: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }
    .frequency-count {
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
    }
    .frequency-track {
      height: 10px;
      border-radius: 999px;
      background: #f2e6d9;
      overflow: hidden;
    }
    .frequency-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d98e3d, #bb4d2f);
    }
    .frequency-meta {
      font-size: 12px;
      color: var(--muted);
    }
    .history-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(255,255,255,.9);
    }
    .history-card strong {
      display: block;
      font-size: 14px;
    }
    .history-card .mini {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: #f8ece3;
      color: #8f3d22;
      font-size: 11px;
      max-width: 100%;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 0;
    }
    .seg-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .seg {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    .seg.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .toolbar-meta {
      color: var(--muted);
      font-size: 12px;
    }
    .table-wrap {
      padding: 14px 18px 18px;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1340px;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      background: rgba(255,255,255,.82);
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #fbf8f4;
      font-size: 12px;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    th[data-key="linkAction"] {
      width: 118px;
    }
    th[data-key="riskReason"] {
      width: 210px;
    }
    th.dragging { opacity: .45; }
    tr:hover td { background: #fffdfa; }
    .hint {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: #a08d7c;
      font-weight: 400;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-投放中 {
      color: var(--green);
      background: #dcfce7;
    }
    .status-疑似拉停 {
      color: var(--orange);
      background: #ffedd5;
    }
    .copyable {
      color: #175cd3;
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 2px;
    }
    .link-actions {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mini-btn {
      border: 1px solid #d9cbbb;
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .mini-btn:hover {
      background: #f9f5f1;
    }
    details.reason {
      min-width: 160px;
    }
    details.reason summary {
      list-style: none;
      cursor: pointer;
      color: #8f3d22;
      font-size: 12px;
      font-weight: 700;
      user-select: none;
    }
    details.reason summary::-webkit-details-marker {
      display: none;
    }
    .reason-body {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: #fbf3ed;
      color: #6f4a39;
      font-size: 12px;
      line-height: 1.5;
    }
    .muted {
      color: var(--muted);
    }
    .empty {
      padding: 36px 18px 44px;
      text-align: center;
      color: var(--muted);
    }
    @media (max-width: 1180px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { flex-direction: column; }
      .hero-actions { width: 100%; }
      .action-btn { width: 100%; }
    }
    @media (max-width: 720px) {
      .summary { grid-template-columns: 1fr; }
      .shell { padding: 18px 12px 28px; }
      h1 { font-size: 24px; }
      .history-row { grid-template-columns: 78px minmax(0, 1fr) 86px; }
    }
  </style>
</head>

    <div class="stack">

        <div class="table-wrap">

          <div class="empty" id="emptyState" hidden>当前筛选条件下没有高成本预警笔记。</div>
        </div>
      </div>

      <div class="panel history-panel fixed-card">
        <div class="panel-title">
          <h2>预警历史趋势</h2>
          <span>按最后投放日期归档，便于看异常集中日</span>
        </div>
        <div class="scroll-body">
          <div class="history-chart" id="historyChart"></div>
        </div>
      </div>

      <div class="panel history-panel fixed-card">
        <div class="panel-title">
          <h2>高频选题</h2>
          <span>直接看选题方向 / 选题分类组合的高频次数</span>
        </div>
        <div class="scroll-body">
          <div class="frequency-chart" id="historyList"></div>
        </div>
      </div>
    </div>
  </div>

    const DEFAULT_COLUMNS = [
      { key: 'deliveryStatus', label: '状态', sortValue: r => r.deliveryStatus || '', exportValue: r => r.deliveryStatus || '' },
      { key: 'name', label: '笔记名称', hint: '单击复制链接 / 双击打开', sortValue: r => r.name || '', exportValue: r => r.name || '', render: r => clickableTitle(r.name || '-', r.link || '', r.link || r.name || '') },
      { key: 'linkAction', label: '链接操作', hint: '收窄显示', sortValue: r => r.link || '', exportValue: r => r.link || '', render: r => renderLinkActions(r.link || '') },
      { key: 'creator', label: '达人', sortValue: r => r.creator || '', exportValue: r => r.creator || '' },
      { key: 'categoryKey', label: '选题分类', sortValue: r => r.categoryKey || '', exportValue: r => r.categoryKey || '' },
      { key: 'firstSpendDate', label: '首投日期', sortValue: r => r.firstSpendDate || '', exportValue: r => r.firstSpendDate || '' },
      { key: 'deliveryDays', label: '投放天数', sortValue: r => Number(r.deliveryDays || 0), exportValue: r => Number(r.deliveryDays || 0), render: r => fmtInt(r.deliveryDays) },
      { key: 'spend', label: '消耗', sortValue: r => Number(r.spend || 0), exportValue: r => Number(r.spend || 0), render: r => fmtMoney(r.spend) },
      { key: 'actionClicks', label: '行动按钮点击量', sortValue: r => Number(r.actionClicks || 0), exportValue: r => Number(r.actionClicks || 0), render: r => fmtInt(r.actionClicks) },
      { key: 'actionCost', label: '行动按钮点击成本', sortValue: r => Number.isFinite(Number(r.actionCost)) ? Number(r.actionCost) : -1, exportValue: r => Number.isFinite(Number(r.actionCost)) ? Number(r.actionCost) : '', render: r => r.actionCost == null ? '-' : fmtMoney(r.actionCost) },
      { key: 'categoryMedianCost', label: '同选题分类投放中中位成本', sortValue: r => Number(r.categoryMedianCost || 0), exportValue: r => Number(r.categoryMedianCost || 0), render: r => r.categoryMedianCost ? fmtMoney(r.categoryMedianCost) : '-' },
      { key: 'riskReason', label: '触发原因', sortValue: r => r.riskReason || '', exportValue: r => r.riskReason || '', render: r => renderReason(r.riskReason || '') },
      { key: 'lastSpendDate', label: '最后投放日期', sortValue: r => r.lastSpendDate || '', exportValue: r => r.lastSpendDate || '' }
    ];

    const state = {
      filter: 'all',
      sortKey: 'actionCost',
      sortDir: 'desc',
      columnOrder: DEFAULT_COLUMNS.map(col => col.key),
      clickTimer: null
    };

    const columnMap = new Map(DEFAULT_COLUMNS.map(col => [col.key, col]));

    function fmtMoney(value) {
      const number = Number(value || 0);
      return `¥${number.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function fmtInt(value) {
      return Number(value || 0).toLocaleString('zh-CN');
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"]/g, s => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[s]);
    }

    function clickableTitle(label, href, copyValue) {
      const safeLabel = esc(label || '-');
      const safeHref = esc(href || '');
      const safeCopy = esc(copyValue || '');
      return `<span class="copyable" data-copy="${safeCopy}" data-href="${safeHref}">${safeLabel}</span>`;
    }

    function renderLinkActions(href) {
      if (!href) return '<span class="muted">-</span>';
      const safeHref = esc(href);
      return `
        <div class="link-actions">
          <button class="mini-btn" data-copy="${safeHref}">复制</button>
          <button class="mini-btn" data-open="${safeHref}">打开</button>
        </div>
      `;
    }

    function renderReason(reason) {
      if (!reason) return '<span class="muted">-</span>';
      return `
        <details class="reason">
          <summary>查看详情</summary>
          <div class="reason-body">${esc(reason)}</div>
        </details>
      `;
    }

    function getColumns() {
      return state.columnOrder.map(key => columnMap.get(key)).filter(Boolean);
    }

    function getFilteredRecords() {
      const records = Array.isArray(DATA.records) ? DATA.records.slice() : [];
      const filtered = state.filter === 'all'
        ? records
        : records.filter(item => item.deliveryStatus === state.filter);
      filtered.sort((a, b) => {
        const column = columnMap.get(state.sortKey) || DEFAULT_COLUMNS[0];
        const left = column.sortValue ? column.sortValue(a) : a[state.sortKey];
        const right = column.sortValue ? column.sortValue(b) : b[state.sortKey];
        const dir = state.sortDir === 'asc' ? 1 : -1;
        if (left == null && right == null) return 0;
        if (left == null) return 1;
        if (right == null) return -1;
        if (typeof left === 'number' && typeof right === 'number') return (left - right) * dir;
        return String(left).localeCompare(String(right), 'zh-CN') * dir;
      });
      return filtered;
    }

    function renderSummary() {
      const records = Array.isArray(DATA.records) ? DATA.records : [];
      const statusCounts = {
        active: records.filter(item => item.deliveryStatus === '投放中').length,
        suspect: records.filter(item => item.deliveryStatus === '疑似拉停').length
      };
      const spend = records.reduce((sum, item) => sum + Number(item.spend || 0), 0);
      document.getElementById('generatedAt').textContent = `生成时间：${DATA.summary.generatedAt || '-'}`;
      document.getElementById('metricCount').textContent = fmtInt(records.length);
      document.getElementById('metricStatus').textContent = `${fmtInt(statusCounts.active)} / ${fmtInt(statusCounts.suspect)}`;
      document.getElementById('metricSpend').textContent = fmtMoney(spend);
      document.getElementById('metricDate').textContent = `${DATA.summary.dateMin || '-'} 至 ${DATA.summary.dateMax || '-'}`;
    }

    function renderHistory() {
      const history = Array.isArray(DATA.history) ? DATA.history.slice(0, 8) : [];
      const frequency = Array.isArray(DATA.frequency) ? DATA.frequency.slice(0, 12) : [];
      const chart = document.getElementById('historyChart');
      const list = document.getElementById('historyList');
      if (!history.length) {
        chart.innerHTML = '<div class="muted">暂无历史预警数据。</div>';
      } else {
        const maxCount = Math.max(...history.map(item => Number(item.count || 0)), 1);
        chart.innerHTML = history.map(item => {
          const width = Math.max(10, Math.round((Number(item.count || 0) / maxCount) * 100));
          return `
            <div class="history-row">
              <div class="history-date">${esc(item.date || '-')}</div>
              <div class="history-bar-track"><div class="history-bar" style="width:${width}%"></div></div>
              <div class="history-meta">${fmtInt(item.count)} 条 / ${fmtMoney(item.spend)}</div>
            </div>
          `;
        }).join('');
      }

      if (!frequency.length) {
        list.innerHTML = '<div class="muted">暂无高频选题数据。</div>';
        return;
      }
      const maxFrequency = Math.max(...frequency.map(item => Number(item.count || 0)), 1);
      list.innerHTML = frequency.map(item => {
        const width = Math.max(10, Math.round((Number(item.count || 0) / maxFrequency) * 100));
        return `
          <div class="frequency-item">
            <div class="frequency-head">
              <div class="frequency-name">${esc(item.combo || '-')}</div>
              <div class="frequency-count">${fmtInt(item.count)} 次</div>
            </div>
            <div class="frequency-track"><div class="frequency-bar" style="width:${width}%"></div></div>
            <div class="frequency-meta">投放中 ${fmtInt(item.activeCount)} / 疑似拉停 ${fmtInt(item.suspectCount)} / 消耗 ${fmtMoney(item.spend)}</div>
          </div>
        `;
      }).join('');
    }

    function renderTable() {
      const records = getFilteredRecords();
      document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === state.filter);
      });
      document.getElementById('tableMeta').textContent = `当前展示 ${records.length} 条；表头支持点击排序、拖动换位；链接列已收窄为轻量操作按钮；触发原因轻触展开。`;

      const table = document.getElementById('riskTable');
      const empty = document.getElementById('emptyState');
      if (!records.length) {
        table.innerHTML = '';
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      const columns = getColumns();
      const head = `<thead><tr>${columns.map(col => {
        const arrow = state.sortKey === col.key ? (state.sortDir === 'asc' ? ' ↑' : ' ↓') : '';
        const hint = col.hint ? `<span class="hint">${esc(col.hint)}</span>` : '';
        return `<th draggable="true" data-key="${col.key}">${esc(col.label)}${arrow}${hint}</th>`;
      }).join('')}</tr></thead>`;

      const body = `<tbody>${records.map(row => `<tr>${columns.map(col => {
        let html = '';
        if (col.key === 'deliveryStatus') {
          html = `<span class="status-pill status-${esc(row.deliveryStatus || '')}">${esc(row.deliveryStatus || '-')}</span>`;
        } else if (typeof col.render === 'function') {
          html = col.render(row);
        } else {
          html = esc(row[col.key] ?? '-');
        }
        return `<td>${html}</td>`;
      }).join('')}</tr>`).join('')}</tbody>`;

      table.innerHTML = head + body;
      bindHeaderEvents();
      bindActionEvents();
    }

    function bindHeaderEvents() {
      const headers = Array.from(document.querySelectorAll('#riskTable th'));
      headers.forEach(th => {
        th.addEventListener('click', event => {
          if (event.target !== th && event.target.closest('.hint')) return;
          const key = th.dataset.key;
          if (state.sortKey === key) {
            state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            state.sortKey = key;
            state.sortDir = key === 'name' ? 'asc' : 'desc';
          }
          renderTable();
        });
        th.addEventListener('dragstart', () => {
          th.classList.add('dragging');
          th.dataset.dragging = '1';
        });
        th.addEventListener('dragend', () => {
          th.classList.remove('dragging');
          delete th.dataset.dragging;
        });
        th.addEventListener('dragover', event => event.preventDefault());
        th.addEventListener('drop', event => {
          event.preventDefault();
          const source = document.querySelector('#riskTable th[data-dragging="1"]');
          if (!source || source === th) return;
          const fromKey = source.dataset.key;
          const toKey = th.dataset.key;
          const next = state.columnOrder.slice();
          const fromIndex = next.indexOf(fromKey);
          const toIndex = next.indexOf(toKey);
          if (fromIndex < 0 || toIndex < 0) return;
          next.splice(fromIndex, 1);
          next.splice(toIndex, 0, fromKey);
          state.columnOrder = next;
          renderTable();
        });
      });
    }

    function bindActionEvents() {
      document.querySelectorAll('.copyable').forEach(node => {
        node.addEventListener('click', () => {
          const value = node.dataset.copy || '';
          clearTimeout(state.clickTimer);
          state.clickTimer = setTimeout(() => {
            if (value) navigator.clipboard.writeText(value).catch(() => undefined);
          }, 220);
        });
        node.addEventListener('dblclick', () => {
          clearTimeout(state.clickTimer);
          const href = node.dataset.href || '';
          if (href) window.open(href, '_blank', 'noopener');
        });
      });

      document.querySelectorAll('[data-copy]').forEach(btn => {
        btn.addEventListener('click', () => {
          const value = btn.dataset.copy || '';
          if (value) navigator.clipboard.writeText(value).catch(() => undefined);
        });
      });
      document.querySelectorAll('[data-open]').forEach(btn => {
        btn.addEventListener('click', () => {
          const href = btn.dataset.open || '';
          if (href) window.open(href, '_blank', 'noopener');
        });
      });
    }

    function exportExcel() {
      if (typeof XLSX === 'undefined') {
        alert('缺少导出组件 xlsx.full.min.js');
        return;
      }
      const columns = getColumns().filter(col => col.key !== 'linkAction');
      const rows = getFilteredRecords().map(row => {
        const out = {};
        columns.forEach(col => {
          out[col.label] = typeof col.exportValue === 'function'
            ? col.exportValue(row)
            : (row[col.key] ?? '');
        });
        out['笔记链接'] = row.link || '';
        return out;
      });
      const sheet = XLSX.utils.json_to_sheet(rows);
      const book = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(book, sheet, '高成本预警');
      XLSX.writeFile(book, `高成本预警-${DATA.summary.dateMax || 'preview'}.xlsx`);
    }

    function bindControls() {
      document.getElementById('filters').addEventListener('click', event => {
        const btn = event.target.closest('[data-filter]');
        if (!btn) return;
        state.filter = btn.dataset.filter;
        renderTable();
      });

      document.getElementById('exportBtn').addEventListener('click', () => {
        exportExcel();
      });
      document.getElementById('resetColumnsBtn').addEventListener('click', () => {
        state.columnOrder = DEFAULT_COLUMNS.map(col => col.key);
        renderTable();
      });
    }

    renderSummary();
    renderHistory();
    bindControls();
    renderTable();
