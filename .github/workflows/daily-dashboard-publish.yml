name: Daily XHS Dashboard Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zhuanzhuan-xhs-dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_WIKI_TOKEN: ${{ secrets.FEISHU_WIKI_TOKEN }}
      FEISHU_SHEET_ID: ${{ secrets.FEISHU_SHEET_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_RISK_ALERT_WEBHOOK_URL: ${{ secrets.FEISHU_RISK_ALERT_WEBHOOK_URL }}
      FEISHU_RISK_ALERT_WEBHOOK_SECRET: ${{ secrets.FEISHU_RISK_ALERT_WEBHOOK_SECRET }}
      FEISHU_RISK_ALERT_CHAT_ID: ${{ secrets.FEISHU_RISK_ALERT_CHAT_ID }}
      SKIP_FEISHU_RISK_ALERT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run governed dashboard publish
