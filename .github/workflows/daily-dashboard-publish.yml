name: Daily XHS Dashboard Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zhuanzhuan-xhs-dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_WIKI_TOKEN: ${{ secrets.FEISHU_WIKI_TOKEN }}
      FEISHU_SHEET_ID: ${{ secrets.FEISHU_SHEET_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_RISK_ALERT_WEBHOOK_URL: ${{ secrets.FEISHU_RISK_ALERT_WEBHOOK_URL }}
      FEISHU_RISK_ALERT_WEBHOOK_SECRET: ${{ secrets.FEISHU_RISK_ALERT_WEBHOOK_SECRET }}
      FEISHU_RISK_ALERT_CHAT_ID: ${{ secrets.FEISHU_RISK_ALERT_CHAT_ID }}
      SKIP_FEISHU_RISK_ALERT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run governed dashboard publish
        run: python dashboard_auto_publish.py

      - name: Build GitHub Pages site
        if: success()
        run: python build_github_pages_site.py

      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-site

      - name: Upload run logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-publish-${{ github.run_id }}
          path: |
            publish_reports/
            publish_run_logs/
            cloudflare-pages-upload/XHS.html
            cloudflare-pages-upload/index.html
            github-pages-site/
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: success()
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: Send risk alert with GitHub Pages link
        if: success()
        env:
          GITHUB_PAGES_RISK_ALERT_URL: ${{ steps.deploy-pages.outputs.page_url }}/risk-alert.html
        run: python feishu_risk_alert.py

      - name: Persist success baseline
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_publish_state/zhuanzhuan_xhs_ads_last_success.json
          if git diff --cached --quiet; then
            echo "No baseline change to commit."
          else
            git commit -m "chore: update dashboard publish baseline [skip ci]"
            git push
          fi
